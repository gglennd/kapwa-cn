<!-- Kapwa ArticleCard — news card with category badge, and an overlay hero variant. -->
<section class="grid gap-6 md:grid-cols-2">
  <section data-demo="standard">
    <!-- Standard article card -->
    <article
      role="article"
      aria-label="News article"
      class="overflow-hidden rounded-lg border border-[var(--color-kapwa-border-weak)] bg-[var(--color-kapwa-bg-surface)] shadow-xs"
    >
      <div class="relative h-48 w-full overflow-hidden">
        <img
          src="https://picsum.photos/seed/kapwa-article/600/400"
          alt="City hall plaza"
          class="h-full w-full object-cover"
        />
      </div>
      <div role="region" aria-label="Article details" class="p-4 md:p-6">
        <span
          class="mb-2 inline-block rounded-sm bg-[var(--color-kapwa-bg-brand-weak)] px-2 py-1 text-xs font-medium text-[var(--color-kapwa-text-brand)]"
          >Local News</span
        >
        <h3 class="text-xl font-semibold mb-2">Quezon City opens new digital service hubs</h3>
        <p class="mb-4 text-[var(--color-kapwa-text-support)]">
          Residents can now access 40 government services from twelve new e-service kiosks across the city.
        </p>
        <a
          href="#"
          class="inline-flex items-center justify-center rounded-md font-medium transition-colors focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-offset-2 h-auto bg-transparent p-0 text-[var(--color-kapwa-text-link)] hover:text-[var(--color-kapwa-text-link-hover)] hover:underline focus-visible:ring-0"
          >Read More</a
        >
      </div>
    </article>
  </section>

  <section data-demo="overlay">
    <!-- Overlay article card -->
    <article
      role="article"
      aria-label="News article"
      class="overflow-hidden rounded-lg border border-[var(--color-kapwa-border-weak)] bg-[var(--color-kapwa-bg-surface)] shadow-xs"
    >
      <div class="relative">
        <div class="relative h-48 w-full overflow-hidden">
          <img
            src="https://picsum.photos/seed/kapwa-article-2/600/400"
            alt="Tree planting activity"
            class="h-full w-full object-cover"
          />
        </div>
        <div class="absolute inset-0 bg-linear-to-t from-black/75 to-transparent flex items-end p-6">
          <div class="text-white">
            <span class="inline-block px-2 py-1 text-xs font-medium rounded-sm bg-white/20 mb-2">Environment</span>
            <h3 class="text-xl font-semibold mb-2">10,000 trees planted in the watershed</h3>
            <p class="text-white/80">Volunteers and city staff completed a two-day reforestation drive.</p>
          </div>
        </div>
      </div>
    </article>
  </section>
</section>
