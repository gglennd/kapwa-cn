<!-- Kapwa Input — text, email, password, disabled, error hint and file cases. -->
<section data-demo="default">
  <div class="space-y-4">
    <div class="grid gap-4 md:grid-cols-2">
      <label class="block">
        <span class="kapwa-label-md block text-[var(--color-kapwa-text-strong)]">Full name</span>
        <input
          type="text"
          placeholder="Juan dela Cruz"
          class="mt-2 flex h-9 w-full rounded-md border border-[var(--color-kapwa-border-strong)] bg-[var(--color-kapwa-bg-surface)] px-3 py-1 text-base text-[var(--color-kapwa-text-strong)] shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-[var(--color-kapwa-text-strong)] placeholder:text-[var(--color-kapwa-text-disabled)] focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-[var(--color-kapwa-border-focus)] disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
        />
      </label>
      <label class="block">
        <span class="kapwa-label-md block text-[var(--color-kapwa-text-strong)]">Email address</span>
        <input
          type="email"
          placeholder="you@example.gov.ph"
          class="mt-2 flex h-9 w-full rounded-md border border-[var(--color-kapwa-border-strong)] bg-[var(--color-kapwa-bg-surface)] px-3 py-1 text-base text-[var(--color-kapwa-text-strong)] shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-[var(--color-kapwa-text-strong)] placeholder:text-[var(--color-kapwa-text-disabled)] focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-[var(--color-kapwa-border-focus)] disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
        />
      </label>
    </div>

    <div class="grid gap-4 md:grid-cols-2">
      <label class="block">
        <span class="kapwa-label-md block text-[var(--color-kapwa-text-strong)]">Birth date</span>
        <input
          type="date"
          class="mt-2 flex h-9 w-full rounded-md border border-[var(--color-kapwa-border-strong)] bg-[var(--color-kapwa-bg-surface)] px-3 py-1 text-base text-[var(--color-kapwa-text-strong)] shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-[var(--color-kapwa-text-strong)] placeholder:text-[var(--color-kapwa-text-disabled)] focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-[var(--color-kapwa-border-focus)] disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
        />
      </label>
      <label class="block">
        <span class="kapwa-label-md block text-[var(--color-kapwa-text-strong)]">Mobile number (disabled)</span>
        <input
          type="tel"
          disabled
          value="0917 000 0000"
          class="mt-2 flex h-9 w-full rounded-md border border-[var(--color-kapwa-border-strong)] bg-[var(--color-kapwa-bg-surface)] px-3 py-1 text-base text-[var(--color-kapwa-text-strong)] shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-[var(--color-kapwa-text-strong)] placeholder:text-[var(--color-kapwa-text-disabled)] focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-[var(--color-kapwa-border-focus)] disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
        />
      </label>
    </div>

    <label class="block max-w-md">
      <span class="kapwa-label-md block text-[var(--color-kapwa-text-strong)]">Attach a document</span>
      <input
        type="file"
        class="mt-2 flex h-9 w-full rounded-md border border-[var(--color-kapwa-border-strong)] bg-[var(--color-kapwa-bg-surface)] px-3 py-1 text-base text-[var(--color-kapwa-text-strong)] shadow-sm transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium file:text-[var(--color-kapwa-text-strong)] placeholder:text-[var(--color-kapwa-text-disabled)] focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-[var(--color-kapwa-border-focus)] disabled:cursor-not-allowed disabled:opacity-50 md:text-sm"
      />
    </label>
  </div>
</section>
